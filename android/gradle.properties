# Machine limitée à 7,8 Go de RAM totale, déjà largement occupée par
# l'émulateur + les IDE — 4G de tas Gradle a fait tuer le daemon (0,3 Go
# libre au moment du crash). Réduit à une taille plus réaliste pour cette
# machine. Même 1,5G a fini par crasher au même endroit (échec de mmap du
# JVM natif, pas un vrai dépassement de tas) une fois la mémoire libre
# retombée sous ~1G — encore réduit, et passé en Serial GC (G1, par défaut,
# réserve de grosses régions virtuelles dès le démarrage, ce que Serial
# évite). org.gradle.workers.max=1 empêche aussi plusieurs workers de
# compilation de tourner en même temps et de cumuler leur mémoire native.
org.gradle.jvmargs=-Xmx896m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true

# Le JBR fourni avec Android Studio est en Java 25 : le Groovy embarqué dans
# Gradle ne sait pas encore lire du bytecode aussi récent pour évaluer les
# scripts de build (settings.gradle/build.gradle), même si Gradle démarre
# sans problème dessus. On force donc un JDK 17 déjà installé sur la machine,
# la version que l'écosystème Flutter/AGP supporte de façon éprouvée.
org.gradle.java.home=D:\\logiciel\\Eclipse Adoptium

# Le projet est sur D: mais le cache Pub (packages Flutter, dont les sources
# Kotlin des plugins comme shared_preferences_android) est sur C: — le
# compilateur Kotlin incrémental plante en essayant de calculer un chemin
# relatif entre deux lettres de lecteur différentes (impossible sous
# Windows). Désactiver l'incrémental évite le calcul de ce chemin relatif.
kotlin.incremental=false
